# Controlled Synthetic GPU Sanity-Check Configuration (loaded by scripts/run_colab_ae.py --config)
experiment_name: "turnfocus_synthetic_gpu_sanity_check_v1"
seeds: [101, 202, 303, 404, 505]
backbones:
  primary_dense: "Qwen/Qwen3-VL-8B-Instruct"
  optional_moe_vl: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  optional_moe_omni: "Qwen/Qwen3-Omni-30B-A3B-Instruct"
  aux_2b_reranker: "Qwen/Qwen3-VL-2B-Instruct"
  keyframe_dual_encoder: "openai/clip-vit-base-patch32"

spatial_tiers:
  r_l1_hw: [112, 112]
  r_l2_hw: [560, 560]

protocol:
  enforce_video_disjoint_splits: true
  temperature: 0.0
  do_sample: false
  l_hist_max: 2048
  # Note: gamma_conf is initialized to 0.80 in default_hyperparams.yaml and then frozen on the dev split
  # by calibrate_on_dev_split() (e.g., 0.45 in the archived synthetic sanity-check run).
  calibrate_on_dev_split: true
  run_offpath_lp_audit: true
  run_component_ablations: true
  run_sensitivity_sweeps: true
  run_silent_modality_breakdown: true
