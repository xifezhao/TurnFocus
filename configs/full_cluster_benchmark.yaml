# Full Multi-Node / Sharded 8-Benchmark Cluster Specification Template (Reference Only)
# Note: Multi-node sharding orchestration (num_shards: 16) is a cluster-job template for external
# Slurm/Ray launchers over locally downloaded official benchmark video corpora; it is not executed
# by the single-GPU scripts/run_colab_ae.py sanity-check runner.
experiment_name: "turnfocus_full_8benchmark"
seeds: [101, 202, 303, 404, 505]
sharding:
  enabled: true
  num_shards: 16
backbones:
  - "Qwen/Qwen3-VL-8B-Instruct"
  - "Qwen/Qwen3-VL-30B-A3B-Instruct"
  - "Qwen/Qwen3-Omni-30B-A3B-Instruct"
benchmarks:
  single_turn: ["Video-MME", "LongVideoBench", "MLVU", "LVBench", "CG-Bench"]
  multi_turn: ["SVBench", "OmniMMI", "VideoMemBench"]
